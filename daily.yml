name: daily-short

on:
  schedule:
    # ساعت به UTC است. مثال: ۱۳:۳۰ UTC = ۱۷:۰۰ تهران
    # ربات یک ساعت زودتر اجرا می‌شود و با PUBLISH_DELAY_MIN انتشار را دقیق روی ساعت هدف می‌گذارد
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "فقط ساخت ویدیو، بدون آپلود (1 یا 0)"
        default: "0"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - run: pip install -r requirements.txt

      - name: Generate and upload short
        env:
          LLM_PROVIDER: gemini      # رایگان؛ برای Claude بنویس claude
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # فقط اگر provider=claude
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LANGUAGE: fa
          TTS_VOICE: fa-IR-FaridNeural
          PRIVACY: private          # بعد از تست موفق بذار public
          PUBLISH_DELAY_MIN: "60"   # انتشار دقیق ۶۰ دقیقه بعد از شروع اجرا
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python main.py

      - name: Save history
        run: |
          git config user.name "shorts-bot"
          git config user.email "bot@users.noreply.github.com"
          git add history.json
          git commit -m "update history" || echo "nothing to commit"
          git push || true

      - name: Keep video as artifact (dry run)
        if: ${{ github.event.inputs.dry_run == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: short
          path: work/short.mp4
