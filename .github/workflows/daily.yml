
name: Trendify Anime Quality Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trendify-anime-quality-test
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra
          ffmpeg -version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate anime short - upload disabled
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_HORDE_API_KEY: ${{ secrets.AI_HORDE_API_KEY }}
          LANGUAGE: fa
          TTS_VOICE: fa-IR-FaridNeural
          LLM_MODEL: gemini-2.5-flash
          FONT_DIR: /usr/share/fonts/truetype/noto
          MODE: anime_story
          DRY_RUN: "1"
        run: |
          python -u main.py
          test -s work/short.mp4
          ffprobe -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            work/short.mp4

      - name: Save video and story files
        if: ${{ always() && hashFiles('work/short.mp4') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: trendify-anime-test-${{ github.run_number }}
          path: |
            work/short.mp4
            work/story.json
            work/media_credits.json
            work/subtitles.ass
          if-no-files-found: warn
          retention-days: 7
